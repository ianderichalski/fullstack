<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div class="container-fluid text-center">
        <div class="row">
            <div class="col bg-primary text-white p-3">
                <h1>Formulário API ViaCep</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-3"></div>
            <div class="col-6 border">
                <form method="post">
                    <div class="mb-3">
                        <label for="cep" class="form-label">CEP:</label>
                        <input type="text" id="cep" name="cep" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="rua" class="form-label">Rua:</label>
                        <input type="text" id="rua" name="rua" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="bairro" class="form-label">Bairro:</label>
                        <input type="text" id="bairro" name="bairro" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="cidade" class="form-label">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado:</label>
                        <input type="text" id="estado" name="estado" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="ibge" class="form-label">IBGE:</label>
                        <input type="text" id="ibge" name="ibge" class="form-control">
                    </div>
                </form>
            </div>
            <div class="col-3"></div>
        </div>
    </div>

    <script>
        const campoCep = document.querySelector("#cep");

        campoCep.addEventListener("blur", function () {
            fetch("https://viacep.com.br/ws/" + campoCep.value + "/json/")
                .then(function (resposta) {
                    return resposta.json();
                })
                .then(function (dados) {
                    document.querySelector("#rua").value    = dados.logradouro;
                    document.querySelector("#bairro").value = dados.bairro;
                    document.querySelector("#cidade").value = dados.localidade;
                    document.querySelector("#estado").value = dados.uf;
                    document.querySelector("#ibge").value   = dados.ibge;
                });
        });
    </script>
</body>
</html>
